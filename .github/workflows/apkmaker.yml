      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }

      - name: Build WebView template
        run: gradle :template:assembleDebug --no-daemon --stacktrace

      - name: Bundle template into APK Maker
        run: |
          mkdir -p app/src/main/assets
          cp template/build/outputs/apk/debug/*.apk app/src/main/assets/template.apk

      - name: Build APK Maker
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Stage app.apk
        run: cp app/build/outputs/apk/debug/app-debug.apk app.apk

      - name: Self-test on-device engine (non-blocking)
        continue-on-error: true
        run: |
          set +e
          SDK=$ANDROID_SDK_ROOT
          AAPT=$(ls $SDK/build-tools/*/aapt | sort | tail -1)
          SIGNER=$(ls $SDK/build-tools/*/apksigner | sort | tail -1)
          SRC=$PWD
          mkdir -p /tmp/st && cd /tmp/st
          cp "$SRC"/app/src/main/java/com/apkmaker/ApkBuilder.java .
          cp "$SRC"/app/src/main/java/com/apkmaker/AxmlPatcher.java .
          echo "" | base64 -d > Gen.java
          {
            echo "### On-device APK engine self-test"
            echo ""
            echo '```'
            javac -d cls ApkBuilder.java AxmlPatcher.java Gen.java 2>&1
            TPL=$(ls "$SRC"/template/build/outputs/apk/debug/*.apk 2>/dev/null | head -1)
            java -cp cls com.apkmaker.Gen "$TPL" "$SRC"/app/src/main/assets/sign/key.pk8 "$SRC"/app/src/main/assets/sign/cert.der 2>&1 && echo "GEN: wrote sample.apk"
            echo "-- apksigner verify --"
            "$SIGNER" verify --min-sdk-version 24 --verbose sample.apk 2>&1
            echo "-- aapt badging --"
            "$AAPT" dump badging sample.apk 2>&1 | grep -E "package: name|application-label:|sdkVersion:"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cp sample.apk "$SRC"/sample.apk 2>/dev/null || true

      - name: Upload APKs as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: APKMaker
          path: |
            app.apk
            sample.apk
          if-no-files-found: warn

      - name: Publish to Releases (best-effort)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apkmaker-${{ github.run_number }}" app.apk \
            --title "apkmaker-${{ github.run_number }}" --notes "APK Maker" || echo "release step skipped"
