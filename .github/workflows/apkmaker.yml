      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }

      - name: Build WebView template
        run: gradle :template:assembleRelease --no-daemon

      - name: Bundle template into APK Maker
        run: |
          mkdir -p app/src/main/assets
          cp template/build/outputs/apk/release/*.apk app/src/main/assets/template.apk

      - name: Build APK Maker
        run: gradle :app:assembleDebug --no-daemon

      - name: Self-test on-device builder with Google tools
        run: |
          set -e
          SDK=$ANDROID_SDK_ROOT
          AAPT=$(ls $SDK/build-tools/*/aapt | sort | tail -1)
          SIGNER=$(ls $SDK/build-tools/*/apksigner | sort | tail -1)
          SRC=$PWD
          mkdir -p /tmp/st && cd /tmp/st
          cp "$SRC"/app/src/main/java/com/apkmaker/ApkBuilder.java .
          cp "$SRC"/app/src/main/java/com/apkmaker/AxmlPatcher.java .
          echo "" | base64 -d > Gen.java
          javac -d cls ApkBuilder.java AxmlPatcher.java Gen.java
          TPL=$(ls "$SRC"/template/build/outputs/apk/release/*.apk | head -1)
          java -cp cls com.apkmaker.Gen "$TPL" \
            "$SRC"/app/src/main/assets/sign/key.pk8 "$SRC"/app/src/main/assets/sign/cert.der
          echo "=== apksigner verify ==="
          "$SIGNER" verify --min-sdk-version 24 --verbose sample.apk
          echo "=== aapt badging ==="
          "$AAPT" dump badging sample.apk | grep -E "^package|application-label:"
          "$AAPT" dump badging sample.apk | grep -q "name='com.apkmaker.gen.sample'" || { echo PACKAGE_PATCH_FAILED; exit 1; }
          "$AAPT" dump badging sample.apk | grep -q "application-label:'Sample App'" || { echo LABEL_PATCH_FAILED; exit 1; }
          echo "SELF-TEST PASSED"

      - name: Publish APK Maker to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk app.apk
          gh release create "apkmaker-${{ github.run_number }}" app.apk \
            --title "apkmaker-${{ github.run_number }}" --notes "APK Maker - built by APK Maker"
