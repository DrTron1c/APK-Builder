      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Build
        working-directory: ${{ inputs.dir || '.' }}
        run: gradle assembleDebug --no-daemon
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          DIR: ${{ inputs.dir || '.' }}
          TAG: ${{ inputs.tag || format('maker-{0}', github.run_number) }}
        run: |
          cp "$DIR/app/build/outputs/apk/debug/app-debug.apk" app.apk
          gh release create "$TAG" app.apk --title "$TAG" --notes "Built by Claude App Maker"
